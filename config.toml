# Text is plain Unicode. Each scene uses terminal cells, not HTML layout.
[profile]
github = "Fiudeus"
user = "Fiudeus"
name = "Artem"
banner = "FIUDEUS"
banner_font = "ansi_shadow"
role = "Data Scientist"
study = "Applied AI student"
campus = "Kursk State University"
focus = "ML / data / desktop / Linux"
hello = "Hello, I'm Artem."
activity_label = "Last public activity"

[terminal]
title = "Fiudeus@github: ~/profile"
shell = "zsh"
banner_spacing = 1
font_size = 15
line_height = 23
desktop_cols = 92
compact_cols = 54
motion = true

[windows]
home = "Fiudeus@github: ~ — zsh"
fastfetch = "fastfetch"
toolbox = "~/toolbox"

[commands]
welcome = "cat welcome.ans"
about = "fastfetch --logo none"
toolbox = "tree ~/toolbox --noreport"

[toolbox]
style = "panels"
categories = [
  ["Languages", "Python / Java / C++ / SQL / Bash"],
  ["Data Analysis", "NumPy / Pandas / SciPy / Matplotlib / Seaborn / Plotly"],
  ["Machine Learning", "Scikit-learn / CatBoost / XGBoost"],
  ["Databases", "PostgreSQL / ClickHouse / SQLite"],
  ["Development", "FastAPI / SQLAlchemy / PySide6 / pytest"],
  ["Tools & Environment", "Git / Docker / Linux"],
  ["Familiar with", "Kotlin / HTML / CSS"],
]
learning_title = "Currently Learning"
learning = ["Backend development", "Algorithms & Data Structures", "System Design", "Big Data", "AI/LLM Engineering", "Deep learning", "Mathematics"]

[github]
exclude_repos = ["Fiudeus", "LuminaRead"]
snapshot = "data/github.json"

[contacts.telegram]
